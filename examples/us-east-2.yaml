Region: us-east-2
Image:
  Os: ubuntu2204
HeadNode:
  InstanceType: c5.4xlarge
  Networking:
    SubnetId: subnet-039af7eb847d4c723
  Ssh:
    KeyName: linshuy2@illinois.edu
  LocalStorage:
    RootVolume:
      Size: 1024
      Encrypted: false
  CustomActions:
    OnNodeConfigured:
      Script: s3://neuron-s3/pcluster/post-install-scripts/neuron-installation/v2.26.0/u22/pt/install_neuron.sh
  Iam:
    S3Access:
       - BucketName: neuron-s3
         EnableWriteAccess: false
