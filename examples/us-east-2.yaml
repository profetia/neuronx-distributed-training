    - Name: compute1
      CapacityType: ONDEMAND
      ComputeSettings:
        LocalStorage:
          RootVolume:
            Size: 1024
            Encrypted: false
      ComputeResources:
        - Efa:
            Enabled: true
          InstanceType: trn1n.32xlarge
          MaxCount: 8
          MinCount: 0
          Name: queue1-i1
      Networking:
        SubnetIds:
          - subnet-0280709d0d231340a
        PlacementGroup:
          Enabled: true
      CustomActions:
        OnNodeConfigured:
          Script: s3://neuron-s3/pcluster/post-install-scripts/neuron-installation/v2.26.0/u22/pt/install_neuron.sh
      Iam:
        S3Access:
          - BucketName: neuron-s3
            EnableWriteAccess: false
SharedStorage:
